version: "3.9"

services:
  # ─── Database (TimescaleDB = PostgreSQL + time-series extension) ───
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: ai_trading_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_trading
      POSTGRES_PASSWORD: changeme_in_production
      POSTGRES_DB: ai_trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (caching, session state, pub/sub) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai_trading_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_trading_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_trading:changeme_in_production@db:5432/ai_trading
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: dev-secret-key-change-in-production
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-thinking}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ─── Frontend (Next.js) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_trading_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  redisdata:
